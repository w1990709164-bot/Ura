<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>里世界 · LIWORLD ARCHIVE</title>
<style>
:root {
  --bg:#0f0f12;
  --bg-panel:#141418;
  --text:#f0eef8;
  --text-muted:#5a5570;
  --accent:#e8354a;
  --accent-dim:#3a0a10;
  --card-bg:#1c1c22;
  --card-hover:#2a2a38;
  --safe-b:env(safe-area-inset-bottom,0px);
  --radius:8px;
  --gap:16px;
}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Noto Serif SC',serif;}
body{background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:24px;}
h1{font-size:3rem;text-align:center;margin-bottom:0.5rem;letter-spacing:4px;}
h2{font-size:1.2rem;text-align:center;margin-bottom:2rem;color:var(--text-muted);}
button{padding:12px 20px;font-size:1rem;border:none;border-radius:var(--radius);cursor:pointer;transition:all 0.2s;}
#start-btn{background:var(--accent);color:var(--text);margin-bottom:var(--gap);}
#start-btn:hover{background:var(--accent-dim);}
#api-btn{background:transparent;color:var(--accent);border:1px solid var(--accent);margin-bottom:24px;}
#api-btn:hover{background:var(--accent);color:var(--text);}
#api-status{min-height:20px;margin:-10px 0 10px;color:var(--text-muted);font-size:.9rem;text-align:center;}
#game-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:var(--gap);width:100%;max-width:920px;margin-top:16px;display:none;}
.card{background:var(--card-bg);padding:16px;border-radius:var(--radius);cursor:pointer;transition:all 0.2s;display:flex;flex-direction:column;align-items:center;text-align:center;position:relative;min-height:150px;justify-content:center;}
.card:hover{background:var(--card-hover);}
.card h3{margin-bottom:8px;color:var(--accent);}.card-tag{position:absolute;top:10px;right:12px;font-size:11px;color:var(--text-muted);letter-spacing:1px;}
#api-modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.6);display:none;align-items:center;justify-content:center;z-index:1000;}
#api-modal .modal-content{background:var(--bg-panel);padding:24px;border-radius:var(--radius);width:90%;max-width:360px;display:flex;flex-direction:column;gap:12px;}
#api-modal label{font-size:0.85rem;color:var(--text-muted);}
#api-modal input{padding:8px;border-radius:var(--radius);border:1px solid var(--accent-dim);background:#1a1a1f;color:var(--text);outline:none;}
#api-modal input:focus{border-color:var(--accent);}
#api-modal button{align-self:flex-end;}
#api-close{background:transparent;color:var(--accent);border:1px solid var(--accent);}
#api-close:hover{background:var(--accent);color:var(--text);}
</style>
</head>
<body>

<h1>里世界</h1>
<h2>LIWORLD ARCHIVE</h2>

<button id="start-btn">开始游戏</button>
<button id="api-btn">设置 API</button>

<div id="api-status" aria-live="polite"></div>

<div id="game-cards">
  <div class="card" data-game="parallel-world">
    <span class="card-tag">01</span>
    <h3>我在基地打工</h3>
    <p>现代军事基地，特遣队，情报系统</p>
  </div>
  <div class="card" data-game="medical-room">
    <span class="card-tag">02</span>
    <h3>我在白塔打工</h3>
    <p>哨向医疗塔，精神图景，白塔体系</p>
  </div>
  <div class="card" data-game="gray-ridge">
    <span class="card-tag">03</span>
    <h3>我在灰脊打工</h3>
    <p>荒原部落，灰盟政治，兽人文化</p>
  </div>
  <div class="card" data-game="capture-her">
    <span class="card-tag">04</span>
    <h3>我在恋综打工</h3>
    <p>系统角色攻略用户，恋爱剧情，修罗场</p>
  </div>
  <div class="card" data-game="hearts-in-crossfire">
    <span class="card-tag">05 · NEW</span>
    <h3>交火心跳：21日</h3>
    <p>COD恋综观察，六位男嘉宾，21日动态剧情</p>
  </div>
</div>

<div id="api-modal">
  <div class="modal-content">
    <label for="api-url">接口链接（OpenAI 兼容；留空则用 Anthropic 官方接口）</label>
    <input type="text" id="api-url" placeholder="https://api.openai.com/v1（可留空）">
    <label for="api-key">API Key</label>
    <input type="text" id="api-key" placeholder="输入你的密钥">
    <label for="api-model">模型名称</label>
    <input type="text" id="api-model" placeholder="如 gpt-4o 或 claude-sonnet-4-20250514">
    <div style="display:flex;justify-content:space-between;margin-top:8px;">
      <button id="api-save">保存</button>
      <button id="api-close">关闭</button>
    </div>
  </div>
</div>

<script>
const startBtn = document.getElementById('start-btn');
const apiBtn = document.getElementById('api-btn');
const gameCards = document.getElementById('game-cards');
const apiModal = document.getElementById('api-modal');
const apiClose = document.getElementById('api-close');
const apiSave = document.getElementById('api-save');
const apiStatus = document.getElementById('api-status');

startBtn.addEventListener('click', ()=>{gameCards.style.display='grid';});
apiBtn.addEventListener('click', ()=>{apiModal.style.display='flex';});
apiClose.addEventListener('click', ()=>{apiModal.style.display='none';});
apiSave.addEventListener('click', ()=>{
    const url=document.getElementById('api-url').value.trim();
    const key=document.getElementById('api-key').value.trim();
    const model=document.getElementById('api-model').value.trim();
    // 链接可留空（留空表示使用 Anthropic 官方接口），但密钥与模型必填
    if(key && model){
        localStorage.setItem('LW_API_URL',url);
        localStorage.setItem('LW_API_KEY',key);
        localStorage.setItem('LW_API_MODEL',model);
        alert('API 设置已保存，全局有效');
        updateApiStatus();
        apiModal.style.display='none';
    }else{
        alert('请至少填写 API Key 和模型名称');
    }
});

// 点击游戏卡片跳转
document.querySelectorAll('.card').forEach(c=>{
    c.addEventListener('click',()=>{
        const game=c.dataset.game;
        window.location.href=`games/${game}/index.html`;
    });
});

// 页面加载自动填充已有 API
window.addEventListener('load',()=>{
    const url=localStorage.getItem('LW_API_URL')||'';
    const key=localStorage.getItem('LW_API_KEY')||'';
    const model=localStorage.getItem('LW_API_MODEL')||'';
    document.getElementById('api-url').value=url;
    document.getElementById('api-key').value=key;
    document.getElementById('api-model').value=model;
    updateApiStatus();
});

function updateApiStatus(){
    const key=localStorage.getItem('LW_API_KEY')||'';
    const model=localStorage.getItem('LW_API_MODEL')||'';
    const url=localStorage.getItem('LW_API_URL')||'';
    if(!apiStatus) return;
    apiStatus.textContent = key && model
      ? `API：已配置 · ${url || 'Anthropic 官方接口'} · ${model}`
      : 'API：未配置。请先点“设置 API”，所有游戏都会共用这里的设置。';
}
</script>

</body>
</html>
